<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Leaderboard — ผลโหวตฐานกิจกรรม (Real-time)</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="brand-badge">
                <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="var(--primary-orange)"/></svg>
            </div>
            <div class="header-titles">
                <h1>🏆 ประกาศผล Leaderboard</h1>
                <p>อัปเดตคะแนนแบบเรียลไทม์จากหน้าโหวต</p>
            </div>
        </div>
        <div class="header-actions">
            <span class="conn-pill" id="connPill"><span class="conn-dot"></span> กำลังเชื่อมต่อ...</span>
            <a class="admin-nav-btn" href="index.html">⬅ กลับหน้าโหวต</a>
        </div>
    </header>

    <main class="lb-main">
        <div class="lb-title-row">
            <div class="lb-updated">🟢 อัปเดตล่าสุด <span id="lbUpdatedTime">-</span></div>
        </div>

        <div class="podium-wrap" id="podiumWrap"></div>

        <div class="runner-up-section">
            <h2>อันดับที่ 4 - 6</h2>
            <div class="runner-up-grid" id="runnerGrid"></div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/stations.js"></script>
    <script src="js/leaderboard.js"></script>
</body>
</html>
